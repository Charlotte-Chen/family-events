<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe3">
<title>週末帶孩子去哪｜台灣親子活動</title>
<meta name="description" content="每天自動更新的台灣親子活動、兒童劇、偶戲、說故事與展覽。">
<style>
:root{--paper:#f6efe3;--card:#fffaf2;--ink:#2b2622;--mute:#7a6e63;--line:#e6dccb;--accent:#d9573b;--teal:#2f6f6a;--sun:#f2b33d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
header{padding:22px 18px 8px;position:relative}
header h1{margin:0;font-size:26px;letter-spacing:.04em;line-height:1.2}
header h1 span{color:var(--accent)}
header p{margin:6px 0 0;color:var(--mute);font-size:13px}
.sun{position:absolute;right:18px;top:18px;width:46px;height:46px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 6px #f2b33d33}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:3px 0}
.row::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-family:inherit}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.near[aria-pressed=true]{background:var(--teal);border-color:var(--teal)}
select.chip{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
#count{font-size:12px;color:var(--mute);margin:6px 2px 0}
main{padding:12px 14px 40px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 12px;overflow:hidden;box-shadow:0 1px 0 #0000000a}
.when{display:flex;align-items:stretch;border-bottom:1px dashed var(--line)}
.date{flex:none;width:76px;background:var(--accent);color:#fff;text-align:center;padding:9px 4px;display:flex;flex-direction:column;justify-content:center}
.date .m{font-size:12px;opacity:.9}.date .d{font-size:28px;font-weight:800;line-height:1.05}.date .w{font-size:12px}
.date.on{background:var(--teal)}.date.on .d{font-size:17px;line-height:1.25}
.meta{padding:9px 12px;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.time{font-size:17px;font-weight:700}
.time small{font-weight:500;color:var(--mute);font-size:12px;margin-left:4px}
.loc{font-size:15px;font-weight:600;color:var(--ink)}
.loc .city{display:inline-block;background:#2f6f6a1a;color:var(--teal);border-radius:6px;padding:0 6px;margin-right:5px;font-size:12px;font-weight:700;vertical-align:1px}
.addr{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body{padding:10px 12px 12px}
.body h2{margin:0 0 6px;font-size:17px;line-height:1.4}
.body h2 a{color:var(--ink);text-decoration:none;background:linear-gradient(transparent 62%,#f2b33d66 0)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{font-size:12px;border-radius:6px;padding:2px 7px;background:#ece3d3;color:#5d5248}
.tag.free{background:#2f6f6a;color:#fff}.tag.paid{background:#fbe1d9;color:#a63d24}.tag.reg{background:#fff1cc;color:#7a5600}
.tag.dist{background:var(--ink);color:#fff}
.desc{font-size:13px;color:var(--mute);margin:7px 0 0;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{display:inline-block;margin-top:9px;font-size:14px;font-weight:700;color:var(--accent);text-decoration:none}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
footer{color:var(--mute);font-size:12px;text-align:center;padding:10px 18px 30px;line-height:1.7}
footer a{color:var(--mute)}
#more{display:block;margin:6px auto 0;border:1.5px solid var(--ink);background:none;border-radius:999px;padding:9px 22px;font-size:14px;font-family:inherit;color:var(--ink)}
</style>
</head>
<body>
<header><div class="sun" aria-hidden="true"></div><h1>週末帶孩子<span>去哪</span></h1><p>台灣親子活動・兒童劇・偶戲・說故事・展覽，每天早上自動更新</p></header>
<div class="bar">
  <div class="row" id="rowDate" role="group" aria-label="日期"></div>
  <div class="row">
    <select class="chip" id="city" aria-label="縣市"><option value="">全部縣市</option></select>
    <button class="chip" id="fee" data-v="">免費／售票：全部</button>
    <button class="chip near" id="near" aria-pressed="false">📍 離我最近</button>
  </div>
  <div class="row" id="rowCat" role="group" aria-label="類型"></div>
  <div id="count"></div>
</div>
<main id="list"><div class="empty">載入中…</div></main>
<footer id="foot"></footer>
<script>
const WD="日一二三四五六";
const S={date:"all",city:"",cat:"",fee:"",near:false,pos:null,limit:40};
let DATA=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function tw(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Taipei"}))}
function range(k){const t=tw(),a=ymd(t);
  if(k==="today")return[a,a];
  if(k==="weekend"){const w=t.getDay();const sat=new Date(t);sat.setDate(t.getDate()+(w===0?-1:6-w));const sun=new Date(sat);sun.setDate(sat.getDate()+1);return[w===0?a:ymd(sat),ymd(sun)]}
  if(k==="week"){const e=new Date(t);e.setDate(t.getDate()+6);return[a,ymd(e)]}
  if(k==="month"){const e=new Date(t.getFullYear(),t.getMonth()+1,0);return[a,ymd(e)]}
  return[a,"9999"]}
function km(a,b,c,d){const R=6371,r=Math.PI/180,x=Math.sin((c-a)*r/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin((d-b)*r/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
// 取在範圍內的第一個場次
function pick(e,[a,b]){const s=e.sessions.find(s=>{const st=s.start.slice(0,10),en=(s.end||s.start).slice(0,10);return en>=a&&st<=b});return s}
function link(e){return e.ticketUrl||e.registrationUrl||e.url||""}
function card(e,s,today){
  const st=s.start.slice(0,10),en=(s.end||s.start).slice(0,10),multi=en>st;
  let dh;
  if(multi&&st<=today){const d=new Date(en+"T00:00");dh=`<div class="date on"><div class="m">進行中</div><div class="d">至<br>${d.getMonth()+1}/${d.getDate()}</div></div>`}
  else{const d=new Date(st+"T00:00");dh=`<div class="date"><div class="m">${d.getMonth()+1}月</div><div class="d">${d.getDate()}</div><div class="w">週${WD[d.getDay()]}</div></div>`}
  let t1=s.start.slice(11,16),t2=(s.end||"").slice(11,16);if(t1==="00:00"&&(!t2||t2==="00:00"||t2==="23:59")){t1="";t2=""}if(t2==="00:00")t2="";
  let time=t1?(t2&&t2!==t1&&!multi?`${t1}–${t2}`:(multi&&t2?`每日 ${t1}–${t2}`:t1)):"時間詳見活動頁";
  if(multi&&st>today){const d=new Date(en+"T00:00");time+=`<small>至 ${d.getMonth()+1}/${d.getDate()}</small>`}
  if(e.sessionCount>1&&!multi)time+=`<small>共 ${e.sessionCount} 場</small>`;
  const venue=s.venue||e.venue||"地點詳見活動頁",addr=s.address||e.address;
  const tags=[`<span class="tag">${esc(DATA.categories[e.category]||"其他")}</span>`];
  if(e.free===true)tags.push('<span class="tag free">免費</span>');else if(e.free===false)tags.push('<span class="tag paid">售票／收費</span>');
  if(e.ticketUrl)tags.push('<span class="tag reg">可線上購票</span>');else if(e.registrationUrl||e.needsRegistration)tags.push('<span class="tag reg">需報名</span>');
  if(e._d!=null)tags.push(`<span class="tag dist">${e._d<1?Math.round(e._d*1000)+" 公尺":e._d.toFixed(1)+" 公里"}</span>`);
  const L=link(e),act=e.ticketUrl?"前往購票 →":(e.registrationUrl?"前往報名 →":"看活動詳情 →");
  const title=L?`<a href="${esc(L)}" target="_blank" rel="noopener">${esc(e.title)}</a>`:esc(e.title);
  const desc=(e.description||"").replace(/https?:\/\/\S+/g,"").replace(/www\.\S+/g,"").trim();
  return `<article class="card"><div class="when">${dh}<div class="meta"><div class="time">${time}</div><div class="loc">${e.city?`<span class="city">${esc(e.city.replace("臺","台"))}</span>`:""}${esc(venue)}</div>${addr&&addr!==venue?`<div class="addr">${esc(addr)}</div>`:""}</div></div>
  <div class="body"><h2>${title}</h2><div class="tags">${tags.join("")}</div>${desc?`<p class="desc">${esc(desc)}</p>`:""}${L?`<a class="go" href="${esc(L)}" target="_blank" rel="noopener">${act}</a>`:""}</div></article>`}
function render(){
  const R=range(S.date),today=R[0];let out=[];
  for(const e of DATA.events){
    if(S.city&&e.city!==S.city)continue;if(S.cat&&e.category!==S.cat)continue;
    if(S.fee==="free"&&e.free!==true)continue;if(S.fee==="paid"&&e.free!==false)continue;
    const s=pick(e,R);if(!s)continue;
    e._d=(S.pos&&s.lat!=null)?km(S.pos[0],S.pos[1],s.lat,s.lng):(S.pos&&e.lat!=null?km(S.pos[0],S.pos[1],e.lat,e.lng):null);
    if(S.near&&e._d==null)continue;
    out.push([e,s])}
  if(S.near)out.sort((a,b)=>a[0]._d-b[0]._d);
  else out.sort((a,b)=>{const x=a[1].start<today?today:a[1].start,y=b[1].start<today?today:b[1].start;return x<y?-1:x>y?1:0});
  $("#count").textContent=`找到 ${out.length} 個活動${S.near?"（依距離排序，只列有座標的活動）":"（依日期排序）"}`;
  $("#list").innerHTML=out.length?out.slice(0,S.limit).map(([e,s])=>card(e,s,today)).join("")+(out.length>S.limit?'<button id="more">再看更多</button>':""):'<div class="empty">這個條件下暫時沒有活動，換個篩選試試看 🙂</div>';
  const m=$("#more");if(m)m.onclick=()=>{S.limit+=40;render()}}
function chips(el,items,key){el.innerHTML=items.map(([v,l])=>`<button class="chip" data-v="${v}" aria-pressed="${S[key]===v}">${l}</button>`).join("");
  el.onclick=ev=>{const b=ev.target.closest("button");if(!b)return;S[key]=b.dataset.v;S.limit=40;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()}}
fetch("data/events.json",{cache:"no-cache"}).then(r=>r.json()).then(d=>{DATA=d;
  chips($("#rowDate"),[["all","全部日期"],["today","今天"],["weekend","這個週末"],["week","未來 7 天"],["month","這個月"]],"date");
  const used=new Set(d.events.map(e=>e.category));
  chips($("#rowCat"),[["","全部類型"],...Object.entries(d.categories).filter(([k])=>used.has(k))],"cat");
  const cs={};d.events.forEach(e=>{if(e.city)cs[e.city]=(cs[e.city]||0)+1});
  const order=["新北市","臺北市"];const cl=Object.keys(cs).sort((a,b)=>(order.indexOf(b)-order.indexOf(a))||cs[b]-cs[a]);
  $("#city").innerHTML+=cl.map(c=>`<option value="${c}">${c.replace("臺","台")}（${cs[c]}）</option>`).join("");
  $("#city").onchange=ev=>{S.city=ev.target.value;S.limit=40;render()};
  const fees=[["","免費／售票：全部"],["free","只看免費"],["paid","只看售票"]];
  $("#fee").onclick=ev=>{const i=(fees.findIndex(f=>f[0]===S.fee)+1)%3;S.fee=fees[i][0];ev.target.textContent=fees[i][1];ev.target.setAttribute("aria-pressed",S.fee!=="");render()};
  $("#near").onclick=ev=>{const b=ev.currentTarget;
    if(S.near){S.near=false;b.setAttribute("aria-pressed","false");b.textContent="📍 離我最近";render();return}
    if(!navigator.geolocation){alert("這支手機不支援定位");return}
    b.textContent="📍 定位中…";
    navigator.geolocation.getCurrentPosition(p=>{S.pos=[p.coords.latitude,p.coords.longitude];S.near=true;b.setAttribute("aria-pressed","true");b.textContent="📍 離我最近 ✓";render()},
      ()=>{b.textContent="📍 離我最近";alert("無法取得位置，請到設定允許瀏覽器使用定位")},{enableHighAccuracy:false,timeout:10000,maximumAge:600000})};
  const g=new Date(d.generatedAt);
  $("#foot").innerHTML=`資料更新：${g.toLocaleString("zh-TW",{timeZone:"Asia/Taipei",hour12:false})}<br>資料來源：${Object.values(d.sources).map(s=>esc(s.label)).join("、")}（政府資料開放授權）<br>活動內容以主辦單位公告為準，出發前請再確認`;
  render()}).catch(()=>{$("#list").innerHTML='<div class="empty">資料載入失敗，請稍後再試</div>'});
</script>
</body>
</html>
